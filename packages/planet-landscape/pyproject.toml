[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-landscape"
version = "0.1.0"
description = "Planetary Diffusion: landscape evolution on a node graph and its coupling to the plate layer"
requires-python = ">=3.12"
dependencies = ["planet-grid", "numpy>=2.0", "numba>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]
