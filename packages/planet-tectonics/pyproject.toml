[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-tectonics"
version = "0.1.0"
description = "Planetary Diffusion: the plate layer (plates, crust history, coarse erosion, isostasy)"
requires-python = ">=3.12"
dependencies = ["planet-grid", "planet-landscape", "numpy>=2.0", "numba>=0.60", "ducc0>=0.34"]

[tool.setuptools.packages.find]
where = ["src"]
