[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-grid"
version = "0.1.0"
description = "Planetary Diffusion: the cube-sphere grid, spherical flexure and shared constants"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "numba>=0.60", "ducc0>=0.34"]

[tool.setuptools.packages.find]
where = ["src"]
