[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-reviews"
version = "0.1.0"
description = "Planetary Diffusion: reviews of the planet against Earth"
requires-python = ">=3.12"
dependencies = ["planet-grid", "numpy>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
arrangement = ["torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
