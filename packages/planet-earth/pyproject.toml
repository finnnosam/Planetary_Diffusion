[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-earth"
version = "0.1.0"
description = "Planetary Diffusion: Earth reference datasets on the cube-sphere grid (readers, references, manifest)"
requires-python = ">=3.12"
dependencies = ["planet-grid", "numpy>=2.0", "rasterio>=1.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planet_earth = ["data_checksums.json"]
