# The repository is a workspace of one package per stage (packages/planet-*/); install them for development with
#   python -m pip install -r requirements-dev.txt
# This file only configures the tools that run from the repository root.

[tool.pytest.ini_options]
testpaths = ["tests"]
# A temp folder inside the repo: the system pytest temp folder is not readable on the owner's machine (29 Oct 2026).
addopts = "--basetemp=outputs/pytest-tmp"
